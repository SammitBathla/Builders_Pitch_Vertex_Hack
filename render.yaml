services:
  - type: web
    name: signal-copilot-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL_ID
        value: claude-opus-5
      - key: MANUAL_MINUTES_PER_CASE
        value: "17"
      - key: DATASET_SEED
        value: "42"
      - key: DATASET_SIZE
        value: "1000"
      # DATABASE_URL: set this once the app is wired to Supabase/Postgres — see TASKS.md.
      # Without it the app falls back to a local SQLite file, which does NOT persist
      # across Render deploys/restarts on the free plan (ephemeral disk).
