services:
  - type: web
    name: signal-copilot-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      # Required — the app has no local-file fallback and will fail to start without it.
      # Set in the Render dashboard (or `render blueprint launch` will prompt for it):
      # your Supabase "Session pooler" connection string. sync:false means Render asks for
      # the value at deploy time rather than storing it in this file.
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL_ID
        value: claude-opus-5
      - key: MANUAL_MINUTES_PER_CASE
        value: "17"
      - key: DATASET_SEED
        value: "42"
      - key: DATASET_SIZE
        value: "1000"
